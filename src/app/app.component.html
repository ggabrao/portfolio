<div class="bg-white dark:bg-gray-900">
  <!-- Header -->
  <header class="absolute inset-x-0 top-0 z-50">
    <nav class="mx-auto flex max-w-7xl items-center justify-between p-6 lg:px-8" aria-label="Global">
      <div class="flex lg:flex-1">
        <span class="mr-2 -translate-y-0.5 text-sm leading-6 dark:text-gray-300">PT</span>
        <button type="button"
          class="group relative inline-flex h-5 w-10 flex-shrink-0 cursor-pointer items-center justify-center rounded-full focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:ring-offset-2 dark:focus:ring-offset-0"
          role="switch" aria-checked="false" (click)="isEnglish = !isEnglish">
          <span class="sr-only">Alterar idioma</span>
          <span aria-hidden="true"
            class="pointer-events-none absolute h-full w-full rounded-md bg-white dark:bg-gray-900"></span>
          <span aria-hidden="true"
            class="pointer-events-none absolute mx-auto h-4 w-9 rounded-full transition-colors duration-200 ease-in-out"
            [ngClass]="{'bg-indigo-600': isEnglish, 'bg-gray-200': !isEnglish}"></span>
          <span aria-hidden="true"
            class="pointer-events-none absolute left-0 inline-block h-5 w-5 transform rounded-full border border-gray-200 bg-white shadow ring-0 transition-transform duration-200 ease-in-out"
            [ngClass]="{'translate-x-5': isEnglish, 'translate-x-0': !isEnglish}"></span>
        </button>
        <span class="ml-2 -translate-y-0.5 text-sm leading-6 dark:text-gray-300">EN</span>
      </div>
      <div class="hidden lg:flex lg:gap-x-12">
        <a routerLink="/" routerLinkActive="active" ariaCurrentWhenActive="page"
          class="text-sm font-semibold leading-6 text-gray-900 dark:text-gray-300 dark:hover:text-gray-100">Home</a>
        <a routerLink="/experience" routerLinkActive="active" ariaCurrentWhenActive="page"
          class="text-sm font-semibold leading-6 text-gray-900 dark:text-gray-300 dark:hover:text-gray-100">Experiência</a>
        <a routerLink="/projects" routerLinkActive="active" ariaCurrentWhenActive="page"
          class="text-sm font-semibold leading-6 text-gray-900 dark:text-gray-300 dark:hover:text-gray-100">Projetos</a>
      </div>
      <div class="hidden lg:flex lg:flex-1 lg:justify-end">
        <div class="pointer-events-auto">
          <button type="button" (click)="toggleTheme()" aria-label="Switch to dark theme"
            class="group rounded-full bg-white/90 px-3 py-2 shadow-lg shadow-zinc-800/5 ring-1 ring-zinc-900/5 backdrop-blur transition dark:bg-zinc-800/90 dark:ring-white/10 dark:hover:ring-white/20">
            <svg viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
              aria-hidden="true"
              class="h-6 w-6 fill-zinc-100 stroke-zinc-500 transition group-hover:fill-zinc-200 group-hover:stroke-zinc-700 dark:hidden [@media(prefers-color-scheme:dark)]:fill-teal-50 [@media(prefers-color-scheme:dark)]:stroke-teal-500 [@media(prefers-color-scheme:dark)]:group-hover:fill-teal-50 [@media(prefers-color-scheme:dark)]:group-hover:stroke-teal-600">
              <path
                d="M8 12.25A4.25 4.25 0 0 1 12.25 8v0a4.25 4.25 0 0 1 4.25 4.25v0a4.25 4.25 0 0 1-4.25 4.25v0A4.25 4.25 0 0 1 8 12.25v0Z">
              </path>
              <path
                d="M12.25 3v1.5M21.5 12.25H20M18.791 18.791l-1.06-1.06M18.791 5.709l-1.06 1.06M12.25 20v1.5M4.5 12.25H3M6.77 6.77 5.709 5.709M6.77 17.73l-1.061 1.061"
                fill="none"></path>
            </svg>
            <svg viewBox="0 0 24 24" aria-hidden="true"
              class="hidden h-6 w-6 fill-zinc-700 stroke-zinc-500 transition dark:block [@media(prefers-color-scheme:dark)]:group-hover:stroke-zinc-400 [@media_not_(prefers-color-scheme:dark)]:fill-teal-400/10 [@media_not_(prefers-color-scheme:dark)]:stroke-teal-500">
              <path
                d="M17.25 16.22a6.937 6.937 0 0 1-9.47-9.47 7.451 7.451 0 1 0 9.47 9.47ZM12.75 7C17 7 17 2.75 17 2.75S17 7 21.25 7C17 7 17 11.25 17 11.25S17 7 12.75 7Z"
                stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </button>
        </div>
      </div>
    </nav>
  </header>

  <router-outlet></router-outlet>

  <!-- Footer -->
  <footer class="mx-auto mt-40 max-w-7xl overflow-hidden px-6 pb-20 sm:mt-64 sm:pb-24 lg:px-8">
    <nav class="-mb-6 columns-2 sm:flex sm:justify-center sm:space-x-12" aria-label="Footer">
      <div class="pb-6">
        <a href="#"

    </nav>
